allow-lan: false
mode: rule        # Режим правил
log-level: info

# === Оптимизация для тяжелого мобильного трафика ===
keep-alive-interval: 30

proxies:
  - name: "Tor SOCKS5"
    type: socks5
    server: 127.0.0.1
    port: 9050    # стандартный Tor SOCKS5 порт
    udp: false    # <- ВАЖНО: Отключаем UDP для Tor, чтобы убрать спам Instagram

proxy-groups:
  - name: "Auto"
    type: select
    proxies:
      - "Tor SOCKS5"
      - "DIRECT"

rules:
  # === 1. Мусорный трафик и ошибочные IP ===
  - IP-CIDR,7.0.0.0/8,REJECT,no-resolve
  - IP-CIDR,0.0.0.0/8,REJECT,no-resolve

  # === 2. ГЛАВНЫЙ ПРИОРИТЕТ ДЛЯ YOUTUBE И REVANCED (В TOR) ===
  - DOMAIN,://googleapis.com,Tor SOCKS5
  - DOMAIN-SUFFIX,googlevideo.com,Tor SOCKS5
  - DOMAIN-SUFFIX,youtube.com,Tor SOCKS5
  - DOMAIN-SUFFIX,youtu.be,Tor SOCKS5
  - DOMAIN-SUFFIX,ytimg.com,Tor SOCKS5
  - DOMAIN-SUFFIX,ggpht.com,Tor SOCKS5
  - DOMAIN-SUFFIX,youtubeeducation.com,Tor SOCKS5
  - DOMAIN-SUFFIX,youtube-nocookie.com,Tor SOCKS5
  - DOMAIN-SUFFIX,revanced.app,Tor SOCKS5
  - DOMAIN-SUFFIX,returnyoutubedislikeapi.com,Tor SOCKS5
  - DOMAIN-SUFFIX,sponsor.ajay.app,Tor SOCKS5

  # === 3. GITHUB И GITLAB (ОБЯЗАТЕЛЬНО ЧЕРЕЗ TOR, ИНАЧЕ ПОЛУЧИШЬ PENDING) ===
  - DOMAIN-SUFFIX,github.com,Tor SOCKS5
  - DOMAIN-SUFFIX,githubusercontent.com,Tor SOCKS5
  - DOMAIN-SUFFIX,githubapp.com,Tor SOCKS5
  - DOMAIN-KEYWORD,github,Tor SOCKS5
